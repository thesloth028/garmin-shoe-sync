# generated from thesloth028/brain@790c4c3 .github/workflows/ci-minimal.yml (brain system/repo-template/README.md).
# A public repo can't call a workflow in a private repo, so this is a copy. Change it in brain, not here.
# Reusable minimal CI for repos with no CI of their own (system/merge-process.md), so the merge job
# has a required check to wait for. One check: the files a branch adds or changes contain no secret
# pattern. The patterns are a copy of scripts/lint_brain.py SECRET_PATTERNS (other repos' jobs can't
# read private brain); scripts/tests/test_merge_workflows.py keeps them equal.
# In this copy the check is named "ci-minimal".
name: ci-minimal

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci-minimal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: no secrets in changed files
        env:
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          python3 - <<'EOF'
          import os, re, subprocess, sys
          PATTERNS = [
              '\\bsk-(?:ant-)?[A-Za-z0-9_-]{20,}',  # OpenAI/Anthropic-style key
              '\\b(?:gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,})',  # GitHub token
              '\\bxai-[A-Za-z0-9]{20,}',  # xAI key
              '\\bAKIA[0-9A-Z]{16}\\b',  # AWS access key
              '\\bxox[abprs]-[A-Za-z0-9-]{10,}',  # Slack token
              '\\b\\d{8,10}:[A-Za-z0-9_-]{35}\\b',  # Telegram bot token
              '\\beyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}',  # JWT
              '-----BEGIN [A-Z ]*PRIVATE KEY-----',  # private key
              '\\b0x[0-9a-fA-F]{64}\\b',  # hex private key
              '(?<![A-Za-z0-9_])(?i:password|passwd|pwd|secret|api_key|apikey)\\s*[:=]\\s*[\\"\']?[^\\s\\"\'`<>${}]{8,}',  # password or secret assignment
          ]
          LOOKS_LIKE = re.compile("|".join(f"(?:{p})" for p in PATTERNS))
          base = "origin/" + os.environ["BASE"]
          r = subprocess.run(["git", "diff", "--name-only", "-z", "--diff-filter=AMR", f"{base}...HEAD"],
                             capture_output=True, text=True)
          if r.returncode:
              sys.exit(f"ci-minimal: git diff against {base} failed: {r.stderr.strip()}")
          bad, unscanned = [], []
          for path in filter(None, r.stdout.split("\0")):
              if os.path.islink(path) or not os.path.isfile(path):
                  continue
              big = os.path.getsize(path) > 2_000_000
              data = b"" if big else open(path, "rb").read()
              if big or b"\0" in data:
                  # an .md file can merge without review (merge job), so it must be scanned or fail;
                  # other large or binary files are never exempt and get a Codex review
                  if path.endswith(".md"):
                      unscanned.append(path)
                  continue
              for n, line in enumerate(data.decode("utf-8", "replace").splitlines(), 1):
                  if LOOKS_LIKE.search(line):
                      bad.append(f"{path}:{n}")
          if unscanned:
              sys.exit("ci-minimal: can't scan (over 2 MB or binary): " + ", ".join(unscanned[:20]))
          if bad:
              sys.exit("ci-minimal: looks like a secret (value not shown): " + ", ".join(bad[:20]))
          print("ci-minimal: no secret patterns in the changed files")
          EOF
